#
# Waylandify Configuration File
#
# Use [[programs]] to define a list of applications to modify.
#
# - 'name': A unique name for this entry (e.g., "vscode").
# - 'executables': A list of binary names to search for (e.g., ["code", "code-insiders"]).
# - 'flags': A list of command-line flags to apply.
# - 'enabled': (optional) Set to false to skip this entry. Default: true
# - 'merge_enable_features': (optional) Merge --enable-features flags. Default: true
#

[[programs]]
name = "Electron Apps"
executables = ["code", "code-insiders", "code-oss"]
flags = [
    "--enable-features=UseOzonePlatform",
    "--ozone-platform=wayland",
    "--gtk-version=4",
]

[[programs]]
name = "Chromium Browsers"
executables = [
    "brave-browser",
    "brave-browser-stable",
    "microsoft-edge",
    "microsoft-edge-stable",
    "google-chrome",
    "google-chrome-stable",
    "chromium",
    "chromium-browser",
]
flags = [
    "--enable-features=TouchpadOverscrollHistoryNavigation",
    "--gtk-version=4",
]

