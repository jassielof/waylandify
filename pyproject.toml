[project]
name = "waylandify"
version = "0.1.0"
description = "CLI to add Wayland support to Chromium-based programs via desktop files and argument flags."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Jassiel Ovando", email = "jassielovando@protonmail.com" }]
dependencies = [
  "pydantic>=2.11.9",
  "tomlkit>=0.13.3",
  "typer>=0.19.2",
  "xdg-desktop-entry",
]

[project.scripts]
waylandify = "cli:app"

[dependency-groups]
dev = [
  "lizard>=1.21.0",
  "mkdocs-material>=9.7.1",
  "mkdocstrings[python]>=1.0.3",
  "pymdown-extensions>=10.20.1",
  "ruff>=0.13.1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cli"

[tool.uv.sources]
xdg-desktop-entry = { git = "https://github.com/jassielof/xdg-desktop-entry-python" }
